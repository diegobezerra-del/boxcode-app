# BoxCode — Netlify Configuration

[build]
  publish = "."

# ── ROTAS ────────────────────────────────
# /        → landing page
# /app     → app com login
# /admin   → painel admin (protegido por senha)
# /demo    → app (link para teste)

[[redirects]]
  from = "/app"
  to   = "/app.html"
  status = 200

[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

[[redirects]]
  from = "/demo"
  to   = "/app.html"
  status = 200

# ── HEADERS ──────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# users.json — sem cache para sempre pegar versão mais recente
[[headers]]
  for = "/users.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
